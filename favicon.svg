<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F131E"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="50%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="100" height="100" rx="28" fill="url(#bgGrad)"/>
  <rect width="98" height="98" x="1" y="1" rx="27" fill="none" stroke="rgba(255,153,0,0.35)" stroke-width="2"/>
  
  <!-- Glowing Sun Core -->
  <circle cx="50" cy="50" r="18" fill="url(#sunGrad)" filter="url(#glow)"/>
  
  <!-- Dynamic Sun Rays -->
  <g stroke="url(#sunGrad)" stroke-width="3.5" stroke-linecap="round">
    <line x1="50" y1="18" x2="50" y2="25"/>
    <line x1="50" y1="75" x2="50" y2="82"/>
    <line x1="18" y1="50" x2="25" y2="50"/>
    <line x1="75" y1="50" x2="82" y2="50"/>
    <line x1="27" y1="27" x2="33" y2="33"/>
    <line x1="67" y1="67" x2="73" y2="73"/>
    <line x1="27" y1="73" x2="33" y2="67"/>
    <line x1="67" y1="33" x2="73" y2="27"/>
  </g>
  <circle cx="50" cy="50" r="11" fill="#FFF9E6" opacity="0.85"/>
</svg>
